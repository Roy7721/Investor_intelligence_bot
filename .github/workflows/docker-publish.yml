# Builds the full image and pushes it to Docker Hub.
#
# Manual only. This is the expensive path: it converts three PDFs through
# Datalab, embeds ~3,200 chunks and runs 24 extraction calls, which takes about
# 25 minutes and spends real API credit every time. Running it on every push
# would burn a free-tier quota in an afternoon for no benefit, since the image
# contents only change when the filings or the pipeline change.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   Docker Hub account name
#   DOCKERHUB_TOKEN      Docker Hub access token, not the account password
#   GOOGLE_API_KEY       Gemini
#   OPENROUTER_API_KEY   embeddings
#   DATALAB_API_KEY      PDF conversion
#
# The three API keys are passed as BuildKit build secrets, so they are mounted
# for one RUN step and never written to a layer. The pushed image contains no
# credentials.

name: Publish image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag, e.g. v1.0 (latest and the short SHA are always pushed)'
        required: false
        default: ''

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        # Fail here with a readable message rather than 20 minutes later inside
        # an API call with an empty key.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATALAB_API_KEY: ${{ secrets.DATALAB_API_KEY }}
        run: |
          missing=""
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN GOOGLE_API_KEY \
                      OPENROUTER_API_KEY DATALAB_API_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "All five secrets present."

      - name: Free disk space
        # The runner starts with ~14 GB free. Between the build cache, the
        # dependency layer and the finished image this gets tight, and the
        # failure looks like an unrelated pip error.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        env:
          EXTRA: ${{ inputs.tag }}
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/investor-intelligence"
          tags="$image:latest,$image:${GITHUB_SHA::7}"
          if [ -n "$EXTRA" ]; then
            tags="$tags,$image:$EXTRA"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Pushing: $tags"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Reuses the dependency layer CI already cached. No cache-to here:
          # exporting a ~1 GB image to the Actions cache is slow and is itself
          # a source of build failures, and this workflow runs rarely enough
          # that the saving would not pay for the risk.
          cache-from: type=gha
          secrets: |
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            DATALAB_API_KEY=${{ secrets.DATALAB_API_KEY }}

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "docker run -p 8000:8000 --env-file .env ${{ steps.meta.outputs.image }}:latest"
            echo '```'
            echo
            echo "Tags: \`${{ steps.meta.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
